<div class="planner-wrapper">
  <!-- 1. Kalendarz -->
  <app-planner-calendar
    [weekDays]="weekDays()"
    [weekRange]="weekRangeString()"
    (daySelected)="selectDay($event)"
    (prevWeek)="previousWeek()"
    (nextWeek)="nextWeek()"
    (todayClicked)="goToToday()">
  </app-planner-calendar>

  <!-- 2. Makroskładniki -->
  @let currentDayString = selectedDate().toISOString().split('T')[0];
  <app-macro-summary
    [consumed]="getDailySummary(currentDayString)"
    [targets]="targetSummary">
  </app-macro-summary>

  <!-- 3. Sloty Posiłków -->
  <main class="meals-list">
    @for (mealType of mealTypes; track mealType) {
      <app-meal-slot
        [mealType]="mealType"
        [meals]="getMealsForSlot(currentDayString, mealType)"
        (addMealClicked)="activeModalSlot.set($event)"
        (removeMeal)="removeMeal($event)">
      </app-meal-slot>
    }
  </main>

  <!-- 4. Modal -->
  @if (activeModalSlot(); as slot) {
    <app-recipe-select-modal
      [slotName]="slot"
      [availableRecipes]="availableRecipes()"
      (recipeSelected)="selectRecipeForSlot($event)"
      (closeModal)="activeModalSlot.set(null)">
    </app-recipe-select-modal>
  }
</div>
