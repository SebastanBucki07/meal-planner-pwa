<section class="card meals-card">
  <h2>Dzisiejsze posiłki</h2>

  <div *ngIf="dashboardService.todayMeals().length === 0" class="empty-meals">
    Brak zarejestrowanych posiłków na dziś.
  </div>

  <ul *ngIf="dashboardService.todayMeals().length > 0" class="meals-list">
    <li
      *ngFor="let meal of dashboardService.todayMeals()"
      [class.completed]="meal.completed"
      role="button"
      tabindex="0"
      (click)="toggleMeal(meal.id, meal.completed)"
      (keyup.enter)="toggleMeal(meal.id, meal.completed)"
      (keyup.space)="toggleMeal(meal.id, meal.completed); $event.preventDefault()"
      class="meal-item"
    >
      <input type="checkbox" [checked]="meal.completed" aria-hidden="true" readonly />
      <span class="meal-name">{{ meal.name }}</span>
      <span class="meal-calories">{{ meal.calories }} kcal</span>
    </li>
  </ul>
</section>
