<div class="recipes-container">
  <header class="header">
    <h1>Baza Przepisów 📖</h1>
  </header>

  <!-- Wyszukiwarka i Filtry -->
  <div class="filters-card">
    <input type="text" class="search-input" placeholder="Szukaj po nazwie..." [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()">
    <div class="filters-grid">
      <input type="number" placeholder="Max kcal" [(ngModel)]="maxCalories" (ngModelChange)="applyFilters()">
      <input type="number" placeholder="Min białko" [(ngModel)]="minProtein" (ngModelChange)="applyFilters()">
      <input type="number" placeholder="Min węgle" [(ngModel)]="minCarbs" (ngModelChange)="applyFilters()">
      <input type="number" placeholder="Min tłuszcz" [(ngModel)]="minFat" (ngModelChange)="applyFilters()">
    </div>
  </div>

  <div class="recipes-grid" *ngIf="!loading; else loadingTpl">
    <div *ngIf="recipes.length === 0" class="empty-state">
      Brak przepisów pasujących do kryteriów.
    </div>

    <!-- Pojedyncza karta przepisu -->
    <div *ngFor="let recipe of recipes" class="recipe-card">
      <div class="recipe-image" *ngIf="recipe.image_url">
        <img [src]="recipe.image_url" [alt]="recipe.title" />
      </div>

      <div class="recipe-header">
        <h3>{{ recipe.title }}</h3>
        <span class="calorie-badge">{{ recipe.calories }} kcal</span>
      </div>

      <div class="macros-grid">
        <div class="macro-box protein">
          <span class="label">Białko</span>
          <span class="val">{{ recipe.protein }}g</span>
        </div>
        <div class="macro-box carbs">
          <span class="label">Węgle</span>
          <span class="val">{{ recipe.carbs }}g</span>
        </div>
        <div class="macro-box fat">
          <span class="label">Tłuszcze</span>
          <span class="val">{{ recipe.fat }}g</span>
        </div>
      </div>

      <a [routerLink]="['/recipes', recipe.id]" class="btn-details">
        Zobacz przepis ➔
      </a>
    </div>
  </div>

  <ng-template #loadingTpl>
    <div class="loading">Ładowanie przepisów...</div>
  </ng-template>

  <!-- Przycisk FAB przekierowujący do pełnego formularza edycji -->
  <a routerLink="/recipes/add" class="btn-fab">+ Nowy przepis</a>
</div>

<app-navbar></app-navbar>
