<div class="profile-container" *ngIf="!loading; else loadingTpl">
  <header class="header">
    <h1>Profil i Kalkulator ⚙️</h1>
    <p>Oblicz swoje BMI i dopasuj cele kaloryczne do swojego stylu życia.</p>
  </header>

  <!-- SEKCJA KALKULATORA BMI I AKTYWNOŚCI -->
  <div class="card calc-card">
    <h2>1. Dane fizyczne i Aktywność</h2>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="height">Wzrost (cm)</label>
        <input
          id="height"
          type="number"
          [(ngModel)]="height"
          (ngModelChange)="calculateBMI()"
          placeholder="np. 180"
        />
      </div>
      <div class="form-group">
        <label for="weight">Waga (kg)</label>
        <input
          id="weight"
          type="number"
          [(ngModel)]="weight"
          (ngModelChange)="calculateBMI()"
          placeholder="np. 80"
        />
      </div>
    </div>

    <!-- Wskaźnik BMI -->
    <div class="bmi-result" *ngIf="bmi" [ngClass]="bmiColorClass">
      <div class="bmi-val">
        BMI:
        <strong>{{ bmi }}</strong>
      </div>
      <div class="bmi-cat">
        Kategoria WHO:
        <strong>{{ bmiCategory }}</strong>
      </div>
    </div>

    <div class="form-grid-2 margin-top">
      <div class="form-group">
        <label for="age">Wiek</label>
        <input id="age" type="number" [(ngModel)]="age" placeholder="30" />
      </div>
      <div class="form-group">
        <label for="gender">Płeć</label>
        <select id="gender" [(ngModel)]="gender">
          <option value="male">Mężczyzna</option>
          <option value="female">Kobieta</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <span class="label">Tryb pracy</span>
      <div class="toggle-buttons">
        <button
          type="button"
          [class.active]="workType === 'sedentary'"
          (click)="workType = 'sedentary'"
        >
          Siedząca
        </button>
        <button
          type="button"
          [class.active]="workType === 'physical'"
          (click)="workType = 'physical'"
        >
          Fizyczna
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="workouts">
        Treningi w tygodniu:
        <strong>{{ workoutsPerWeek }}x</strong>
      </label>
      <input id="workouts" type="range" min="0" max="6" step="1" [(ngModel)]="workoutsPerWeek" />
    </div>

    <!-- 3 PRZYCISKI CELU -->
    <div class="form-group">
      <span class="label">Jaki jest Twój cel?</span>
      <div class="goal-buttons">
        <button type="button" [class.active]="goal === 'lose'" (click)="goal = 'lose'">
          📉 Chcę schudnąć
        </button>
        <button type="button" [class.active]="goal === 'maintain'" (click)="goal = 'maintain'">
          ⚖️ Utrzymać wagę
        </button>
        <button type="button" [class.active]="goal === 'gain'" (click)="goal = 'gain'">
          📈 Chcę przytyć
        </button>
      </div>
    </div>

    <button type="button" class="btn-calc" (click)="calculateTDEE()">
      🧮 Oblicz i przelicz cele makro
    </button>
  </div>

  <!-- SEKCJA EDYCJI CELÓW -->
  <div class="card form-card margin-top">
    <h2>2. Dzienne cele makroskładników</h2>

    <div class="form-group">
      <label for="targetCalories">Cel Kaloryczny (kcal)</label>
      <input id="targetCalories" type="number" [(ngModel)]="targetCalories" />
    </div>

    <div class="form-grid-3">
      <div class="form-group">
        <label for="targetProtein">Białko (g)</label>
        <input id="targetProtein" type="number" [(ngModel)]="targetProtein" />
      </div>
      <div class="form-group">
        <label for="targetCarbs">Węgle (g)</label>
        <input id="targetCarbs" type="number" [(ngModel)]="targetCarbs" />
      </div>
      <div class="form-group">
        <label for="targetFat">Tłuszcze (g)</label>
        <input id="targetFat" type="number" [(ngModel)]="targetFat" />
      </div>
    </div>

    <div class="status-msg" *ngIf="message">{{ message }}</div>

    <button type="button" class="btn-save" (click)="saveProfile()" [disabled]="saving">
      {{ saving ? 'Zapisywanie...' : 'Zapisz Ustawienia w Bazie' }}
    </button>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="loading">Ładowanie profilu...</div>
</ng-template>
