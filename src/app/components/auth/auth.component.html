<div class="auth-container">
  <h2>{{ isSignUp ? 'Zarejestruj się' : 'Zaloguj się' }}</h2>
  <p class="subtitle">Aplikacja do planowania posiłków i redukcji wagi</p>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Adres E-mail</label>
      <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="twoj@email.com">
    </div>

    <div class="form-group">
      <label for="password">Hasło</label>
      <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loading" class="btn-primary">
      {{ loading ? 'Przetwarzanie...' : (isSignUp ? 'Utwórz konto' : 'Zaloguj') }}
    </button>
  </form>

  <button class="btn-toggle" (click)="toggleMode()">
    {{ isSignUp ? 'Masz już konto? Zaloguj się' : 'Nie masz konta? Zarejestruj się' }}
  </button>
</div>
