<div class="container">
  <div class="card">
    <h2>Dodaj nowy składnik</h2>

    <form (ngSubmit)="onSubmit()" #form="ngForm">
      <!-- Nazwa składnika -->
      <div class="form-group">
        <label for="name">Nazwa składnika *</label>
        <input
          type="text"
          id="name"
          [(ngModel)]="name"
          name="name"
          placeholder="np. Pierś z kurczaka"
          required
        />
      </div>

      <!-- Kategoria & Domyślna jednostka -->
      <div class="form-row">
        <div class="form-group">
          <label for="category">Kategoria</label>
          <select id="category" [(ngModel)]="categoryId" name="categoryId">
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="unit">Domyślna jednostka</label>
          <select id="unit" [(ngModel)]="defaultUnitId" name="defaultUnitId">
            <option *ngFor="let u of units" [value]="u.id">{{ u.name }}</option>
          </select>
        </div>
      </div>

      <hr />
      <h3>Wartości odżywcze (na 100g)</h3>

      <!-- Kalorie -->
      <div class="form-group">
        <label for="calories">Kalorie (kcal)</label>
        <input
          type="number"
          id="calories"
          [(ngModel)]="caloriesPer100g"
          name="caloriesPer100g"
          min="0"
          step="0.1"
        />
      </div>

      <!-- Makro składniki -->
      <div class="form-row macros">
        <div class="form-group">
          <label for="protein">Białko (g)</label>
          <input
            type="number"
            id="protein"
            [(ngModel)]="proteinPer100g"
            name="proteinPer100g"
            min="0"
            step="0.1"
          />
        </div>

        <div class="form-group">
          <label for="fat">Tłuszcze (g)</label>
          <input
            type="number"
            id="fat"
            [(ngModel)]="fatPer100g"
            name="fatPer100g"
            min="0"
            step="0.1"
          />
        </div>

        <div class="form-group">
          <label for="carbs">Węglowodany (g)</label>
          <input
            type="number"
            id="carbs"
            [(ngModel)]="carbsPer100g"
            name="carbsPer100g"
            min="0"
            step="0.1"
          />
        </div>
      </div>

      <!-- Przycisk zapisu -->
      <button type="submit" class="btn-submit" [disabled]="loading || !name.trim()">
        {{ loading ? 'Zapisywanie...' : 'Dodaj składnik' }}
      </button>
    </form>
  </div>
</div>
